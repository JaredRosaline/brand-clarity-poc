<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Clarity Questionnaire</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <nav>
    <a href="index.html">Home</a> |
    <a href="questionnaire.html">Questionnaire</a> |
    <a href="results.html">Results</a>
  </nav>

  <main class="app">

    <section class="hero">
      <p class="eyebrow">Step 1 of 2</p>
      <h1>Brand Discovery Questionnaire</h1>
      <p>
        Answer the following questions to receive personalized branding recommendations.
      </p>
    </section>

    <form id="brandForm" class="card">

      <label>
        What type of business are you creating?
        <select id="businessType" required>
          <option value="">Choose one</option>
          <option value="cafe">Café / Bakery</option>
          <option value="beauty">Beauty / Lifestyle</option>
          <option value="events">Events / Creative Services</option>
          <option value="shop">Online Shop</option>
        </select>
      </label>

      <br><br>

      <label>
        How do you want your brand to feel?
        <select id="brandFeeling" required>
          <option value="">Choose one</option>
          <option value="warm">Warm and welcoming</option>
          <option value="luxury">Elegant and elevated</option>
          <option value="playful">Fun and expressive</option>
          <option value="minimal">Clean and modern</option>
        </select>
      </label>

      <br><br>

      <label>
        What style are you most drawn to?
        <select id="visualStyle" required>
          <option value="">Choose one</option>
          <option value="soft">Soft neutrals</option>
          <option value="bold">Bold colors</option>
          <option value="dark">Moody tones</option>
          <option value="fresh">Fresh and bright</option>
        </select>
      </label>

      <br><br>

      <label>
        Who is your primary target audience?
        <select id="targetAudience">
          <option value="">Choose one</option>
          <option value="young">Young Adults</option>
          <option value="families">Families</option>
          <option value="professionals">Professionals</option>
          <option value="luxury">High-End Clients</option>
        </select>
      </label>

      <br><br>

      <label>
        What is your biggest branding goal?
        <select id="brandGoal">
          <option value="">Choose one</option>
          <option value="recognition">Increase Brand Recognition</option>
          <option value="sales">Increase Sales</option>
          <option value="social">Grow Social Media Presence</option>
          <option value="website">Increase Website Traffic</option>
        </select>
      </label>

      <br><br>

      <label>
        Which color palette best matches your vision?
        <select id="colorPreference">
          <option value="">Choose one</option>
          <option value="neutral">Neutral & Minimal</option>
          <option value="earthy">Warm Earth Tones</option>
          <option value="bold">Bold & Vibrant</option>
          <option value="dark">Dark & Moody</option>
        </select>
      </label>

      <br><br>

      <button type="submit">Generate My Brand Results</button>

    </form>

  </main>

  <script src="script.js"></script>

</body>
</html>
